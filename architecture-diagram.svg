  <text x="765" y="531" text-anchor="middle" font-size="11" fill="#14532D">Reachable from anywhere</text>
  <path d="M765,495 L765,420" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="775" y="462" font-size="11" fill="#15803D">HTTPS 443</text>

  <!-- Legend -->
  <g font-size="11" fill="#334155">
    <line x1="48" y1="503" x2="88" y2="503" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrBlue)"/>
    <text x="96" y="507">Agent telemetry to manager (TLS)</text>
    <line x1="48" y1="525" x2="88" y2="525" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
    <text x="96" y="529">Simulated attack traffic</text>
    <line x1="300" y1="503" x2="340" y2="503" stroke="#475569" stroke-width="2" marker-end="url(#arrGrey)"/>
    <text x="348" y="507">Internal Wazuh data flow</text>
    <line x1="300" y1="525" x2="340" y2="525" stroke="#15803D" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="348" y="529">Analyst access</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
