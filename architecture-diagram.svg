  <text x="765" y="168" text-anchor="middle" font-size="11" fill="#431407">Decoders + default ruleset</text>
  <text x="765" y="184" text-anchor="middle" font-size="11" fill="#431407">Alert levels 0 to 16</text>
  <text x="765" y="200" text-anchor="middle" font-size="11" fill="#431407">Built-in MITRE + NIST tags</text>

  <rect x="670" y="245" width="190" height="62" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
  <text x="765" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#7C2D12">Wazuh Indexer</text>
  <text x="765" y="291" text-anchor="middle" font-size="11" fill="#431407">Stores alerts and events</text>

  <rect x="670" y="342" width="190" height="78" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
  <text x="765" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#7C2D12">Wazuh Dashboard</text>
  <text x="765" y="388" text-anchor="middle" font-size="11" fill="#431407">Search · triage</text>
  <text x="765" y="404" text-anchor="middle" font-size="11" fill="#431407">ATT&amp;CK view</text>

  <path d="M765,210 L765,245" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrGrey)"/>
  <path d="M765,307 L765,342" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrGrey)"/>

  <!-- Agent -> Manager -->
  <path d="M500,178 L670,158" fill="none" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <path d="M500,384 L585,384 L585,188 L670,188" fill="none" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="585" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#1D4ED8">Logs: 1514/tcp</text>
  <text x="585" y="151" text-anchor="middle" font-size="11" fill="#1D4ED8">encrypted, authenticated</text>
