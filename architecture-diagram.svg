<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FFFFFF"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F172A">SOC Home Lab: Wazuh SIEM, Sysmon &amp; MITRE ATT&amp;CK</text>

  <!-- Host machine -->
  <rect x="30" y="60" width="490" height="400" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="48" y="84" font-size="13" font-weight="bold" fill="#334155">Host: Windows 11 + VMware Workstation</text>
  <text x="48" y="101" font-size="11" fill="#475569">Local lab network (isolated, self-owned)</text>

  <!-- Kali -->
  <rect x="55" y="250" width="170" height="110" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="140" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#7F1D1D">Kali Linux VM</text>
  <text x="140" y="294" text-anchor="middle" font-size="11" fill="#7F1D1D">Attacker</text>
  <text x="140" y="318" text-anchor="middle" font-size="11" fill="#450A0A">Recon · exploitation</text>
  <text x="140" y="334" text-anchor="middle" font-size="11" fill="#450A0A">Attack simulation</text>

  <!-- Windows 10 -->
  <rect x="315" y="115" width="185" height="170" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="407" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A8A">Windows 10 VM</text>
  <text x="407" y="157" text-anchor="middle" font-size="11" fill="#1E3A8A">Monitored endpoint</text>
  <rect x="327" y="168" width="161" height="22" rx="4" fill="#BFDBFE"/>
  <text x="407" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Wazuh agent</text>
  <text x="407" y="209" text-anchor="middle" font-size="11" fill="#0F172A">Sysmon (SwiftOnSecurity cfg)</text>
  <text x="407" y="226" text-anchor="middle" font-size="11" fill="#0F172A">Security · System · Application</text>
  <text x="407" y="243" text-anchor="middle" font-size="11" fill="#0F172A">PowerShell 4103 / 4104</text>
  <text x="407" y="260" text-anchor="middle" font-size="11" fill="#0F172A">4688 + command-line audit</text>

  <!-- Ubuntu -->
  <rect x="315" y="320" width="185" height="120" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="407" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A8A">Ubuntu VM</text>
  <text x="407" y="362" text-anchor="middle" font-size="11" fill="#1E3A8A">Monitored endpoint</text>
  <rect x="327" y="373" width="161" height="22" rx="4" fill="#BFDBFE"/>
  <text x="407" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A8A">Wazuh agent</text>
  <text x="407" y="412" text-anchor="middle" font-size="11" fill="#0F172A">auth.log · syslog</text>
  <text x="407" y="428" text-anchor="middle" font-size="11" fill="#0F172A">kern.log · dpkg.log</text>

  <!-- Attack arrows -->
  <path d="M225,285 L315,205" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <path d="M225,325 L315,380" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="62" y="396" font-size="11" fill="#B91C1C" font-weight="bold">Simulated attack traffic</text>
  <text x="62" y="411" font-size="11" fill="#B91C1C">(recon → C2 → exfil)</text>

  <!-- Oracle Cloud -->
  <rect x="650" y="60" width="230" height="400" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="665" y="84" font-size="13" font-weight="bold" fill="#9A3412">Oracle Cloud (free tier)</text>
  <text x="665" y="101" font-size="11" fill="#9A3412">Wazuh all-in-one install</text>

  <rect x="670" y="120" width="190" height="90" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
